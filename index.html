<!doctype html><html lang="ko"><link rel="stylesheet" href="cloud/cloud.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>환상향 RPG v80</title><style>body{background:#171320;color:#eee3ce;font:16px/1.8 system-ui,sans-serif;margin:0;padding:30px}main{max-width:680px;margin:30px auto;padding:28px;border:1px solid #aa8954;border-radius:16px;background:#292036}h1{font-size:25px;color:#edcb86}button,.button{background:#634985;color:white;padding:12px 20px;border:1px solid #d3b977;border-radius:8px;font:inherit;cursor:pointer;display:inline-block;text-decoration:none;margin:6px 6px 6px 0}#status{white-space:pre-wrap;color:#edcb86}small{color:#c9bdcf}input{max-width:100%}</style><main><h1>환상향 RPG v80</h1><p>이미지·음악을 분리한 메모리 개선판입니다. 기존 게임과 저장 키는 유지됩니다.</p><p>이전 파일에서 플레이했다면 먼저 저장 기록을 가져오세요. 실행 주소가 달라져 기록이 자동으로 옮겨지지는 않습니다.</p><a class="button" id="start" href="gensokyo_rpg.html">환상향으로 출발</a><button id="exportSave">현재 기록 백업</button><p><label>기존 기록 가져오기: <input type="file" id="importSave" accept=".json,application/json"></label></p><p id="status" role="status"></p><small>플레이 중에는 START_GAME.bat으로 열린 창을 유지해주세요.<br>앞으로도 같은 브라우저와 http://127.0.0.1:8765 주소를 사용해주세요.</small></main><script>const SAVE_KEYS=['gensokyo-rpg:permanent','junhaGensokyoLastVisit'];
const statusBox=document.getElementById('status');
function say(message){statusBox.textContent=message;}
function collectSave(){const entries={};for(const key of SAVE_KEYS){const value=localStorage.getItem(key);if(value!==null)entries[key]=value;}return entries;}
function downloadSave(entries){const payload={format:'gensokyo-save-transfer',version:1,entries};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='gensokyo-save-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
document.getElementById('exportSave').onclick=()=>{try{const entries=collectSave();if(!entries[SAVE_KEYS[0]])throw new Error('이 주소에서 기존 저장 기록을 찾지 못했어요. 원래 게임을 실행하던 브라우저·폴더·파일명을 확인해주세요.');downloadSave(entries);say('저장 백업 파일을 내려받았어요. 원본 기록은 그대로 유지됩니다.');}catch(error){say(error.message);}};
const input=document.getElementById('importSave');
if(input)input.onchange=async()=>{try{const file=input.files[0];if(!file)return;if(file.size>20*1024*1024)throw new Error('저장 파일 크기가 너무 큽니다. 게임 HTML이 아니라 저장 JSON 파일을 선택해주세요.');const payload=JSON.parse(await file.text());if(payload.format!=='gensokyo-save-transfer'||payload.version!==1||!payload.entries||typeof payload.entries[SAVE_KEYS[0]]!=='string')throw new Error('이 복구 도구에서 내보낸 저장 JSON 파일을 선택해주세요.');const save=JSON.parse(payload.entries[SAVE_KEYS[0]]);if(!save||save.saveVersion!==1)throw new Error('저장 파일 형식이 맞지 않아요.');for(const key of SAVE_KEYS){if(payload.entries[key]!==undefined&&typeof payload.entries[key]!=='string')throw new Error('저장 데이터 형식이 맞지 않아요.');}const before=collectSave();if(before[SAVE_KEYS[0]]){if(!confirm('현재 주소에 저장 기록이 있습니다. 현재 기록을 백업한 뒤 선택한 기록으로 바꿀까요?'))return;downloadSave(before);}try{for(const key of SAVE_KEYS)if(payload.entries[key]!==undefined)localStorage.setItem(key,payload.entries[key]);}catch(error){for(const key of SAVE_KEYS){if(before[key]===undefined)localStorage.removeItem(key);else localStorage.setItem(key,before[key]);}throw error;}say('기존 저장 기록을 가져왔어요. 이제 게임을 시작해주세요.');window.dispatchEvent(new CustomEvent('gensokyo-local-save'));}catch(error){say('가져오기 실패: '+error.message);}finally{input.value='';}};
try{say(localStorage.getItem(SAVE_KEYS[0])?'이 주소에 저장 기록이 있어요. 게임 시작 시 그대로 불러옵니다.':'이 주소에 저장 기록이 없어요. 기존 기록이 있다면 먼저 가져오세요.');}catch(error){say('저장 공간에 접근하지 못했어요. 브라우저 설정을 확인해주세요.');}

if(location.protocol==='file:'){document.getElementById('start').removeAttribute('href');say('이 화면을 직접 열지 말고, 같은 폴더의 START_GAME.bat을 실행해주세요.');}
</script><script src="cloud/firebase-config.js"></script><script type="module" src="cloud/cloud-ui.mjs"></script></html>
